name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install dependencies
        run: npm ci
      - name: run TextMate scope tests
        run: npm test
      - name: check generated grammar is up to date
        run: |
          npx --no-install gulp yaml
          git diff --exit-code -- syntaxes/rust.tmLanguage.json
      - name: package extension
        run: npx --no-install vsce package
