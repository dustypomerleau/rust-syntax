name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run Textmate scope tests
        # use the same version of vscode-tmgrammar-test as in package.lock.json
        run: npx vscode-tmgrammar-test@0.1.1 "./test/**/*.rs" --compact --grammar ./syntaxes/rust.tmLanguage.json
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install dependencies
        run: npm ci
      - name: check generated grammar is up to date
        run: |
          npx gulp yaml
          git diff --exit-code -- syntaxes/rust.tmLanguage.json
      - name: package extension
        run: npx vsce package
